<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge Shoot</title>
    <style>
        /* 画面のスクロールを防止し、スマホアプリっぽく全画面表示する設定 */
        body { margin: 0; padding: 0; background-color: #1e1e24; overflow: hidden; touch-action: none; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; }
        #game-container { position: relative; width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background-color: #2b2b36; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 10px; }
        #ui { position: absolute; top: 10%; color: #fff; font-size: 28px; font-weight: bold; text-align: center; width: 100%; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">SCORE: <span id="score">0</span></div>
        <canvas id="game"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // ゲームの設定
        const COLS = 5; // 横の列数
        const ROWS = 7; // 縦の行数
        let BLOCK_SIZE = 0;
        let score = 0;
        let board = Array.from({length: COLS}, () => []);
        let nextVal = 2;
        let currentBlock = null;

        // ブロックの色（2048ベース）
        const colors = {
            2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 
            32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 
            512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
        };

        // 画面サイズに合わせてキャンバスを初期化
        function init() {
            const container = document.getElementById('game-container');
            const w = container.clientWidth * 0.95;
            BLOCK_SIZE = w / COLS;
            
            canvas.width = BLOCK_SIZE * COLS;
            canvas.height = BLOCK_SIZE * ROWS + BLOCK_SIZE * 1.5;
            
            if(!currentBlock) spawnBlock();
            update();
        }

        // 角丸四角形を描画する関数
        function drawRoundedRect(x, y, w, h, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fill();
        }

        // 数字ブロックを描画する関数
        function drawBlock(val, x, y) {
            const pad = 3; // ブロック同士の隙間
            const size = BLOCK_SIZE - pad * 2;
            drawRoundedRect(x + pad, y + pad, size, size, 12, colors[val] || '#ff4d4d');
            
            ctx.fillStyle = val <= 4 ? '#776e65' : '#fff';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(val, x + BLOCK_SIZE / 2, y + BLOCK_SIZE / 2);
        }

        function spawnBlock() {
            currentBlock = { val: nextVal, col: Math.floor(COLS/2), y: canvas.height - BLOCK_SIZE, moving: false };
            const vals = [2, 4, 8, 16];
            nextVal = vals[Math.floor(Math.random() * vals.length)];
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 発射ライン（点線）
            ctx.strokeStyle = '#555';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - BLOCK_SIZE * 1.2);
            ctx.lineTo(canvas.width, canvas.height - BLOCK_SIZE * 1.2);
            ctx.stroke();
            ctx.setLineDash([]);

            // すでに積み上がっているブロックの描画
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < board[c].length; r++) {
                    let drawY = (ROWS - 1 - r) * BLOCK_SIZE; // 下から積み上げる計算
                    drawBlock(board[c][r], c * BLOCK_SIZE, drawY);
                }
            }

            // 今から撃つブロックの描画
            if (currentBlock) {
                drawBlock(currentBlock.val, currentBlock.col * BLOCK_SIZE, currentBlock.y);
            }
        }

        // 合体（マージ）の判定
        function checkMerge(c, r) {
            if (r > 0 && board[c][r] === board[c][r - 1]) {
                board[c].pop(); // 撃ったブロックを消す
                board[c][r - 1] *= 2; // 下のブロックの数字を2倍にする
                score += board[c][r - 1];
                scoreEl.innerText = score;
                // 連鎖反応があるか少し遅らせて再チェック
                setTimeout(() => checkMerge(c, r - 1), 100); 
            } else if (board[c].length >= ROWS) {
                alert("GAME OVER! Score: " + score);
                board = Array.from({length: COLS}, () => []);
                score = 0;
                scoreEl.innerText = score;
            }
        }

        // ゲームのメインループ（弾の移動など）
        function update() {
            if (currentBlock && currentBlock.moving) {
                currentBlock.y -= 35; // 弾の飛ぶスピード
                
                let targetY = (ROWS - 1 - board[currentBlock.col].length) * BLOCK_SIZE;
                
                // ターゲットの高さに到達したか
                if (currentBlock.y <= targetY) {
                    currentBlock.moving = false;
                    board[currentBlock.col].push(currentBlock.val);
                    checkMerge(currentBlock.col, board[currentBlock.col].length - 1);
                    spawnBlock(); // 次の弾をセット
                }
            }
            draw();
            requestAnimationFrame(update); // 画面を更新し続ける
        }

        // 画面タップで発射位置を決めて撃つ
        canvas.addEventListener('pointerdown', (e) => {
            if (currentBlock && currentBlock.moving) return; // 発射中は撃てない
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            currentBlock.col = Math.floor(x / BLOCK_SIZE);
            currentBlock.moving = true;
        });

        // 起動時の処理
        window.onload = init;
        window.addEventListener('resize', init);
    </script>
</body>
</html>
