<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge Shoot RPG - Epic Space Transition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #game-container { width: 100%; height: 100%; }
        canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        const config = {
            type: Phaser.AUTO,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 720, height: 1280, parent: 'game-container' },
            backgroundColor: '#1e1e1e',
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        let alliedUnits, enemyUnits;
        let turnText, turn = 1, isTurnExecuting = false;
        
        const MAX_HP = 1000;
        let globalHP = 1000, hpBarFill, hpText;

        const COLS = 7, ENEMY_ROWS = 7, ALLIED_ROWS = 3;
        const TILE_SIZE = 90;
        const START_X = (720 - (TILE_SIZE * COLS)) / 2;
        const ENEMY_START_Y = 120;
        const ALLIED_START_Y = ENEMY_START_Y + (ENEMY_ROWS * TILE_SIZE) + 40;

        let darkBgOverlay = null;
        
        let bossEnemy = null; 
        let bossUI = [];
        let isShooterMode = false;
        let spaceYOffset = 0; // ★カメラが宇宙へ移動した際の座標補正用

        function preload() {
            this.load.image('hero', 'hero.png');
            this.load.image('arrow', 'arrow.png');
            this.load.image('enemy', 'enemy.png');
            this.load.image('enemy2', 'enemy2.png'); 
            this.load.image('enemy2_roar', 'enemy2_roar.png'); 
            this.load.image('partner', 'partner.png'); 
            this.load.image('superhero', 'superhero.png'); 
            
            this.load.audio('shoot', 'shoot.mp3');
            this.load.audio('hit', 'hit.mp3');
            this.load.audio('crowned', 'crowned.mp3');
            this.load.audio('roar', 'roar.mp3'); 
        }

        function create() {
            const g = this.make.graphics({x: 0, y: 0, add: false});
            g.fillStyle(0xffffff);
            g.fillRect(0, 0, 2, 2); 
            g.generateTexture('star', 2, 2);

            this.input.on('pointerdown', () => {
                if (this.sound.context && this.sound.context.state === 'suspended') {
                    this.sound.context.resume();
                }
            });

            turnText = this.add.text(360, 40, `TURN: ${turn}`, { fontSize: '32px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

            setupGrid(this, { x: START_X, y: ENEMY_START_Y, color: 0x4a1a1a }, ENEMY_ROWS, COLS);
            setupGrid(this, { x: START_X, y: ALLIED_START_Y, color: 0x3a3a3a }, ALLIED_ROWS, COLS);

            alliedUnits = this.add.group();
            enemyUnits = this.add.group();

            spawnAlliedUnit(this, 1, 'Hero', 3, 1, 1);
            spawnEnemyUnit(this, 1, 'Enemy', 3, 0, 1); 

            const uiY = 1150;
            this.add.text(70, uiY, 'LIFE', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            this.add.rectangle(130, uiY, 380, 40, 0x555555).setOrigin(0, 0.5);
            hpBarFill = this.add.rectangle(130, uiY, 380, 40, 0x00e676).setOrigin(0, 0.5);
            hpText = this.add.text(320, uiY, `${globalHP} / ${MAX_HP}`, { fontSize: '22px', fill: '#000', fontStyle:'bold' }).setOrigin(0.5);

            const attackBtn = this.add.circle(620, uiY, 60, 0xff3d00).setInteractive();
            this.add.text(620, uiY, 'FIRE!', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            
            attackBtn.on('pointerdown', () => executeTurn(this));

            this.input.on('drag', handleDrag, this);
            this.input.on('dragend', handleDragEnd, this);
        }

        function update() {}

        function setupGrid(scene, config, rows, cols) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const tileX = config.x + c * TILE_SIZE + TILE_SIZE / 2;
                    const tileY = config.y + r * TILE_SIZE + TILE_SIZE / 2;
                    scene.add.rectangle(tileX, tileY, TILE_SIZE - 4, TILE_SIZE - 4, config.color).setOrigin(0.5);
                }
            }
        }

        function spawnAlliedUnit(scene, level, type, gridX, gridY, hp) {
            const worldX = START_X + gridX * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ALLIED_START_Y + gridY * TILE_SIZE + TILE_SIZE / 2;
            
            let unit;
            try {
                unit = scene.add.sprite(worldX, worldY, 'hero').setOrigin(0.5);
                unit.setDisplaySize(TILE_SIZE - 10, TILE_SIZE - 10);
            } catch (e) {
                unit = scene.add.rectangle(worldX, worldY, TILE_SIZE - 10, TILE_SIZE - 10, 0x90caf9).setOrigin(0.5);
            }
            
            unit.setInteractive();
            scene.input.setDraggable(unit);
            unit.setData({ isAllied: true, level: level, type: type, gridX: gridX, gridY: gridY, hp: hp });
            
            const text = scene.add.text(worldX, worldY + 30, `Lv${level}`, { fontSize: '20px', fill: '#fff', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
            unit.setData('text', text);
            alliedUnits.add(unit);
            return unit;
        }

        function spawnEnemyUnit(scene, level, type, gridX, gridY, hp) {
            const worldX = START_X + gridX * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ENEMY_START_Y + gridY * TILE_SIZE + TILE_SIZE / 2;
            
            const unit = scene.add.sprite(worldX, worldY, 'enemy').setOrigin(0.5);
            unit.setDisplaySize(TILE_SIZE - 10, TILE_SIZE - 10);
            
            unit.setData({ isAllied: false, hp: hp, maxHp: hp, level: level, gridX: gridX, gridY: gridY, type: type });
            
            const hpTxt = scene.add.text(worldX - 12, worldY - 40, `${hp}`, { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(1, 0.5);
            const bgBar = scene.add.rectangle(worldX - 8, worldY - 40, 36, 6, 0x555555).setOrigin(0, 0.5);
            const hpBar = scene.add.rectangle(worldX - 8, worldY - 40, 36, 6, 0xff0000).setOrigin(0, 0.5);
            
            unit.setData('ui', [hpTxt, bgBar, hpBar]);
            enemyUnits.add(unit);
            return unit;
        }

        function takeDamage(amount, scene) {
            globalHP -= amount;
            if (globalHP < 0) globalHP = 0;
            hpBarFill.width = 380 * (globalHP / MAX_HP);
            hpText.setText(`${globalHP} / ${MAX_HP}`);
            
            if (globalHP === 0) {
                alliedUnits.getChildren().forEach(hero => {
                    if (hero.getData('text')) hero.getData('text').setVisible(false);
                    scene.tweens.add({ targets: hero, y: hero.y - 60, duration: 200, yoyo: true });
                    scene.tweens.add({ targets: hero, angle: 90, duration: 400 });
                });
                
                scene.time.delayedCall(500, () => {
                    scene.add.text(360, 640, 'GAME OVER', { 
                        fontSize: '80px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 8 
                    }).setOrigin(0.5).setDepth(100);
                });
            }
        }

        function createDialog(scene, x, y, textString) {
            return scene.add.text(x, y, textString, { 
                fontSize: '36px', fill: '#ff0000', fontStyle: 'bold', align: 'center', stroke: '#fff', strokeThickness: 5 
            }).setOrigin(0.5).setDepth(200);
        }

        function executeTurn(scene) {
            if (isTurnExecuting) return;
            isTurnExecuting = true;

            handleAttack(scene, () => {
                moveEnemiesForward(scene, () => {
                    turn++;
                    turnText.setText(`TURN: ${turn}`);
                    isTurnExecuting = false;
                });
            });
        }

        function handleAttack(scene, onComplete) {
            const allies = alliedUnits.getChildren();
            const enemies = enemyUnits.getChildren();
            
            if (allies.length === 0) { if(onComplete) onComplete(); return; }

            const unit = allies[0];
            const alliedCol = unit.getData('gridX');
            const enemiesInSameCol = enemies.filter(enemy => enemy.active && enemy.getData('gridX') === alliedCol);
            let targetEnemy = null;
            if (enemiesInSameCol.length > 0) {
                enemiesInSameCol.sort((a, b) => b.getData('gridY') - a.getData('gridY'));
                targetEnemy = enemiesInSameCol[0];
            }

            let arrow;
            try {
                arrow = scene.add.sprite(unit.x, unit.y, 'arrow').setOrigin(0.5);
                arrow.setDisplaySize(30, 70);
            } catch(e) {
                arrow = scene.add.rectangle(unit.x, unit.y, 8, 80, 0xffea00).setOrigin(0.5);
            }

            scene.physics.add.existing(arrow);
            arrow.body.setVelocityY(-1200);

            try { scene.sound.play('shoot'); } catch(e) {}

            const damage = unit.getData('level') * 25; 
            let hitDone = false;

            const updateEvent = scene.time.addEvent({
                delay: 20,
                loop: true,
                callback: () => {
                    if (arrow.y < -50) {
                        arrow.destroy();
                        updateEvent.remove();
                        if (onComplete) onComplete(); 
                        return;
                    }

                    if (targetEnemy && targetEnemy.active && !hitDone) {
                        if (arrow.y <= targetEnemy.y + TILE_SIZE/2) {
                            hitDone = true;
                            try { scene.sound.play('hit'); } catch(e) {}
                            
                            const currentHP = targetEnemy.getData('hp');
                            const newHP = currentHP - damage;
                            
                            arrow.destroy();
                            updateEvent.remove();

                            if (newHP <= 0) {
                                targetEnemy.setData('hp', 0);
                                const ui = targetEnemy.getData('ui');
                                ui[0].setText(`0`);
                                ui[2].width = 0;

                                scene.tweens.add({
                                    targets: targetEnemy,
                                    x: targetEnemy.x + 15,
                                    duration: 50,
                                    yoyo: true,
                                    repeat: 5,
                                    onComplete: () => {
                                        
                                        darkBgOverlay = scene.add.rectangle(360, 640, 720, 1280, 0x000000, 0.8).setDepth(40);
                                        
                                        targetEnemy.setDepth(50);
                                        ui.forEach(u => u.setVisible(false));

                                        scene.tweens.add({
                                            targets: targetEnemy,
                                            x: 360,
                                            y: 640,
                                            displayWidth: 640,
                                            displayHeight: 640,
                                            duration: 1000,
                                            onComplete: () => {
                                                const dialogueText = scene.add.text(360, 1050, "あれ？僕誕生日だよね？？", { 
                                                    fontSize: '36px', fill: '#ff0000', fontStyle: 'bold', align: 'center', stroke: '#fff', strokeThickness: 5 
                                                }).setOrigin(0.5).setDepth(60);

                                                scene.time.delayedCall(3000, () => {
                                                    dialogueText.setText("なんで攻撃されるの？？");

                                                    scene.time.delayedCall(3000, () => {
                                                        dialogueText.setText("許さん。殺す！");
                                                        
                                                        scene.time.delayedCall(2000, () => {
                                                            dialogueText.setVisible(false);

                                                            try { scene.sound.play('crowned'); } catch(e) {}

                                                            const whiteSilhouette = scene.add.sprite(targetEnemy.x, targetEnemy.y, 'enemy').setOrigin(0.5);
                                                            whiteSilhouette.setDisplaySize(targetEnemy.displayWidth, targetEnemy.displayHeight);
                                                            whiteSilhouette.setTintFill(0xffffff);
                                                            whiteSilhouette.setAlpha(0); 
                                                            whiteSilhouette.setDepth(targetEnemy.depth + 1);
                                                            
                                                            const targetBossX = targetEnemy.x + 120;
                                                            const targetBossY = targetEnemy.y - 180;
                                                            scene.tweens.add({ targets: targetEnemy, x: targetBossX, y: targetBossY, duration: 1500, ease: 'Power2' });
                                                            scene.tweens.add({ targets: whiteSilhouette, x: targetBossX, y: targetBossY, duration: 1500, ease: 'Power2' });

                                                            const screenLight = scene.add.rectangle(360, 640, 720, 1280, 0xffffff).setOrigin(0.5);
                                                            screenLight.setAlpha(0);
                                                            screenLight.setDepth(100);

                                                            scene.tweens.add({
                                                                targets: [whiteSilhouette, screenLight],
                                                                alpha: 1, 
                                                                duration: 1500,
                                                                ease: 'Power2',
                                                                onComplete: () => {
                                                                    targetEnemy.setVisible(false);
                                                                    whiteSilhouette.destroy();

                                                                    bossEnemy = scene.add.sprite(360, 480, 'enemy2').setOrigin(0.5);
                                                                    bossEnemy.setDisplaySize(500, 500);
                                                                    bossEnemy.setDepth(50);

                                                                    scene.time.delayedCall(1000, () => {
                                                                        scene.tweens.add({
                                                                            targets: screenLight,
                                                                            alpha: 0,
                                                                            duration: 2500,
                                                                            ease: 'Linear',
                                                                            onComplete: () => {
                                                                                
                                                                                bossEnemy.setTexture('enemy2_roar');
                                                                                try { scene.sound.play('roar'); } catch(e) {} 
                                                                                
                                                                                scene.cameras.main.shake(1500, 0.02);

                                                                                const shockwave = scene.add.circle(bossEnemy.x, bossEnemy.y + 40, 20).setStrokeStyle(8, 0xffffff, 1).setDepth(60);
                                                                                scene.tweens.add({ 
                                                                                    targets: shockwave, 
                                                                                    radius: 500,
                                                                                    alpha: 0, 
                                                                                    duration: 1500, 
                                                                                    ease: 'Cubic.easeOut', 
                                                                                    onComplete: () => {
                                                                                        shockwave.destroy();
                                                                                        bossEnemy.setTexture('enemy2');
                                                                                        
                                                                                        const baseW = 500, baseH = 500, baseY = 480;

                                                                                        scene.tweens.add({
                                                                                            targets: bossEnemy,
                                                                                            displayHeight: baseH * 0.75,
                                                                                            displayWidth: baseW * 1.15,
                                                                                            y: baseY + 85, 
                                                                                            duration: 700, 
                                                                                            ease: 'Sine.easeInOut',
                                                                                            onComplete: () => {
                                                                                                
                                                                                                scene.tweens.add({
                                                                                                    targets: bossEnemy,
                                                                                                    displayHeight: baseH * 1.1,
                                                                                                    displayWidth: baseW * 0.9,
                                                                                                    y: -500, 
                                                                                                    duration: 700,
                                                                                                    delay: 300,
                                                                                                    ease: 'Cubic.easeIn',
                                                                                                    onComplete: () => {
                                                                                                        
                                                                                                        if (darkBgOverlay) {
                                                                                                            darkBgOverlay.destroy();
                                                                                                            darkBgOverlay = null;
                                                                                                        }

                                                                                                        bossEnemy.setDisplaySize(500, 500); 
                                                                                                        
                                                                                                        scene.tweens.add({
                                                                                                            targets: bossEnemy,
                                                                                                            y: 480, 
                                                                                                            duration: 2500, 
                                                                                                            delay: 500, 
                                                                                                            ease: 'Sine.easeInOut',
                                                                                                            onComplete: () => {
                                                                                                                const hpBarWidth = 680;
                                                                                                                const bossHpBg = scene.add.rectangle(20, 60, hpBarWidth, 24, 0x555555).setOrigin(0, 0.5).setDepth(100);
                                                                                                                const bossHpFill = scene.add.rectangle(20, 60, 0, 24, 0xff0000).setOrigin(0, 0.5).setDepth(101);
                                                                                                                const bossNameText = scene.add.text(20, 25, "AWAKENED BOSS", { 
                                                                                                                    fontSize: '22px', fill: '#ff3333', fontStyle: 'bold', stroke: '#fff', strokeThickness: 3 
                                                                                                                }).setDepth(100);
                                                                                                                
                                                                                                                bossUI = [bossHpBg, bossHpFill, bossNameText];

                                                                                                                scene.tweens.add({
                                                                                                                    targets: bossHpFill,
                                                                                                                    width: hpBarWidth,
                                                                                                                    duration: 1500,
                                                                                                                    ease: 'Power3.easeOut',
                                                                                                                    onComplete: () => {
                                                                                                                        startFusionEvent(scene);
                                                                                                                    }
                                                                                                                });
                                                                                                            }
                                                                                                        });
                                                                                                    }
                                                                                                });
                                                                                            }
                                                                                        });
                                                                                    }
                                                                                });
                                                                            }
                                                                        });
                                                                    });
                                                                }
                                                            });
                                                        });
                                                    });
                                                });
                                            }
                                        });
                                    }
                                });
                            } else {
                                targetEnemy.setData('hp', newHP);
                                const ui = targetEnemy.getData('ui');
                                const maxHp = targetEnemy.getData('maxHp');
                                ui[0].setText(`${newHP}`);
                                ui[2].width = 36 * (newHP / maxHp);
                                
                                scene.time.delayedCall(500, () => {
                                    if (onComplete) onComplete();
                                });
                            }
                        }
                    }
                }
            });
        }

        function startFusionEvent(scene) {
            const hero = alliedUnits.getChildren()[0];
            if (!hero) return;

            scene.cameras.main.pan(hero.x, hero.y, 1000, 'Power2');
            scene.cameras.main.zoomTo(2, 1000, 'Power2');

            scene.time.delayedCall(1700, () => {
                const heroText1 = createDialog(scene, hero.x, hero.y - 70, "やばくね？");

                scene.time.delayedCall(2000, () => {
                    heroText1.destroy();

                    const partner = scene.add.sprite(hero.x + 200, hero.y, 'partner').setOrigin(0.5);
                    partner.setDisplaySize(TILE_SIZE - 10, TILE_SIZE - 10);
                    partner.setDepth(hero.depth + 1);

                    scene.tweens.add({
                        targets: partner,
                        x: hero.x + 70,
                        duration: 800,
                        ease: 'Power2.easeOut',
                        onComplete: () => {
                            const partnerText = createDialog(scene, partner.x, partner.y - 70, "合体しよ！");

                            scene.time.delayedCall(2000, () => {
                                partnerText.destroy();

                                const heroText2 = createDialog(scene, hero.x, hero.y - 70, "いいよ！");

                                scene.time.delayedCall(2000, () => {
                                    heroText2.destroy();

                                    scene.tweens.add({
                                        targets: partner,
                                        x: hero.x,
                                        duration: 800,
                                        ease: 'Power2.easeIn'
                                    });

                                    const flash = scene.add.rectangle(hero.x, hero.y, 3000, 3000, 0xffffff).setOrigin(0.5).setDepth(200);
                                    flash.setAlpha(0);

                                    scene.tweens.add({
                                        targets: flash,
                                        alpha: 1,
                                        duration: 800,
                                        yoyo: true,
                                        hold: 500,
                                        onYoyo: () => {
                                            hero.setTexture('superhero');
                                            hero.setDisplaySize(TILE_SIZE * 1.5, TILE_SIZE * 1.5);
                                            partner.destroy();
                                            if (hero.getData('text')) hero.getData('text').setVisible(false);
                                        },
                                        onComplete: () => {
                                            flash.destroy();
                                            
                                            const heroText3 = createDialog(scene, hero.x, hero.y - 70, "・・・殺す！");
                                            
                                            scene.time.delayedCall(2500, () => {
                                                heroText3.destroy();
                                                
                                                scene.cameras.main.pan(360, 640, 1000, 'Power2');
                                                scene.cameras.main.zoomTo(1, 1000, 'Power2');

                                                scene.time.delayedCall(1700, () => {
                                                    transitionToShooter(scene, hero);
                                                });
                                            });
                                        }
                                    });
                                });
                            });
                        }
                    });
                });
            });
        }

        // ★宇宙への打ち上げ〜カメラパンの神演出
        function transitionToShooter(scene, hero) {
            turnText.setVisible(false);
            
            const heroBaseH = hero.displayHeight;
            const heroBaseW = hero.displayWidth;
            const bossBaseH = bossEnemy.displayHeight;
            const bossBaseW = bossEnemy.displayWidth;
            
            // 1. 力をためる（1秒かけて潰れる）
            scene.tweens.add({
                targets: hero,
                displayHeight: heroBaseH * 0.6,
                displayWidth: heroBaseW * 1.3,
                y: hero.y + (heroBaseH * 0.2), // 少し下に沈む
                duration: 1000,
                ease: 'Sine.easeOut'
            });
            
            scene.tweens.add({
                targets: bossEnemy,
                displayHeight: bossBaseH * 0.7,
                displayWidth: bossBaseW * 1.2,
                y: bossEnemy.y + (bossBaseH * 0.15),
                duration: 1000,
                ease: 'Sine.easeOut',
                onComplete: () => {
                    // 2. 弾みをつけて超高速で上空(画面外)へカッ飛ぶ
                    scene.tweens.add({
                        targets: hero,
                        displayHeight: heroBaseH * 1.2, // 縦にシュッと伸びる
                        displayWidth: heroBaseW * 0.8,
                        y: -1500, // 遥か上空へ
                        duration: 400,
                        ease: 'Cubic.easeIn'
                    });
                    
                    scene.tweens.add({
                        targets: bossEnemy,
                        displayHeight: bossBaseH * 1.1,
                        displayWidth: bossBaseW * 0.9,
                        y: -1500,
                        duration: 400,
                        ease: 'Cubic.easeIn',
                        onComplete: () => {
                            // キャラサイズを元に戻し、一旦古いボスUIを破棄
                            hero.setDisplaySize(heroBaseW, heroBaseH);
                            bossEnemy.setDisplaySize(bossBaseW, bossBaseH);
                            bossUI.forEach(ui => ui.destroy());
                            bossUI = [];

                            // 3. なにもなくなった盤面を少し見せる（余韻）
                            scene.time.delayedCall(800, () => {
                                
                                // 4. カメラの上空（Y=-1280 ~ 0の範囲）に宇宙を生成しておく
                                spaceYOffset = -1280; // 操作系の座標を宇宙用にずらすフラグ
                                
                                scene.add.rectangle(360, -640, 720, 1280, 0x000000).setDepth(250);
                                
                                // 星空（少し透明で小さめ。邪魔にならない）
                                scene.add.particles(0, -1330, 'star', {
                                    x: { min: 0, max: 720 },
                                    y: 0,
                                    lifespan: 3000,
                                    speedY: { min: 1000, max: 3000 },
                                    scale: { min: 0.2, max: 0.8 }, 
                                    alpha: { min: 0.2, max: 0.6 },
                                    quantity: 10,
                                    blendMode: 'ADD'
                                }).setDepth(251);

                                // 5. カメラがぐーっと上（宇宙）へパンしていく！
                                scene.cameras.main.pan(360, -640, 2000, 'Sine.easeInOut');

                                // パンが終わったら対峙シーンへ
                                scene.time.delayedCall(2000, () => {
                                    startShooterMode(scene, hero);
                                });
                            });
                        }
                    });
                }
            });
        }

        function startShooterMode(scene, hero) {
            isShooterMode = true;
            
            hero.setDepth(260);
            bossEnemy.setDepth(260);
            
            // ★カメラの新しい中心は(360, -640)。画面下部はY=0、上部はY=-1280になる
            
            hero.x = 360;
            hero.y = 200; // 新しい画面の少し下（見えない位置）から
            scene.tweens.add({
                targets: hero,
                y: -280, // 新しい画面の下寄り定位置へ
                duration: 1000,
                ease: 'Power2'
            });
            
            bossEnemy.x = 360;
            bossEnemy.y = -1600; // 新しい画面の少し上から
            scene.tweens.add({
                targets: bossEnemy,
                y: -1030, // 新しい画面の上寄り定位置へ
                duration: 1000,
                ease: 'Power2',
                onComplete: () => {
                    // ★ボスUIを再生成（setScrollFactor(0)をつけて画面に完全固定する）
                    const hpBarWidth = 680;
                    const bossHpBg = scene.add.rectangle(20, 60, hpBarWidth, 24, 0x555555).setOrigin(0, 0.5).setDepth(300).setScrollFactor(0);
                    const bossHpFill = scene.add.rectangle(20, 60, hpBarWidth, 24, 0xff0000).setOrigin(0, 0.5).setDepth(301).setScrollFactor(0);
                    const bossNameText = scene.add.text(20, 25, "AWAKENED BOSS", { 
                        fontSize: '22px', fill: '#ff3333', fontStyle: 'bold', stroke: '#fff', strokeThickness: 3 
                    }).setDepth(300).setScrollFactor(0);
                    
                    bossUI = [bossHpBg, bossHpFill, bossNameText];
                }
            });

            // ★シューティング用のオートショット
            scene.time.addEvent({
                delay: 150, 
                loop: true,
                callback: () => {
                    if (!isShooterMode || !hero.active) return;
                    
                    const bullet = scene.add.sprite(hero.x, hero.y - 50, 'arrow').setOrigin(0.5).setDepth(255);
                    bullet.setDisplaySize(40, 100); // 矢を2倍サイズに
                    scene.physics.add.existing(bullet);
                    bullet.body.setVelocityY(-2000); 
                    
                    try { scene.sound.play('shoot'); } catch(e) {}
                    
                    const checkHitEvent = scene.time.addEvent({
                        delay: 20,
                        loop: true,
                        callback: () => {
                            if (!bullet.active) { checkHitEvent.remove(); return; }
                            
                            // 宇宙の画面上端（-1280）より少し上で消去
                            if (bullet.y < -1380) { 
                                bullet.destroy();
                                checkHitEvent.remove();
                            } else if (bossEnemy && bossEnemy.active) {
                                if (Math.abs(bullet.x - bossEnemy.x) < 150 && bullet.y < bossEnemy.y + 100) {
                                    bullet.destroy();
                                    checkHitEvent.remove();
                                    try { scene.sound.play('hit'); } catch(e) {}
                                    
                                    bossEnemy.setTint(0xff8888);
                                    scene.time.delayedCall(50, () => bossEnemy.clearTint());
                                }
                            }
                        }
                    });
                }
            });
        }

        function moveEnemiesForward(scene, onComplete) {
            const enemies = enemyUnits.getChildren();
            let enemiesToDestroy = [];
            let isGameOverThisTurn = false; 

            if(enemies.length === 0) { if(onComplete) onComplete(); return; }

            enemies.forEach(enemy => {
                if (!enemy.active) return;
                let newY = enemy.getData('gridY') + 1;
                enemy.setData('gridY', newY);

                if (newY >= ENEMY_ROWS) {
                    const invasionY = ALLIED_START_Y + 1 * TILE_SIZE + TILE_SIZE / 2;
                    scene.tweens.add({ targets: enemy, y: invasionY, duration: 300 });
                    scene.tweens.add({ targets: enemy.getData('ui'), y: invasionY - 40, duration: 300 });
                    
                    isGameOverThisTurn = true; 
                    enemiesToDestroy.push(enemy);
                } else {
                    const worldY = ENEMY_START_Y + newY * TILE_SIZE + TILE_SIZE / 2;
                    scene.tweens.add({ targets: enemy, y: worldY, duration: 300 });
                    scene.tweens.add({ targets: enemy.getData('ui'), y: worldY - 40, duration: 300 });
                }
            });

            scene.time.delayedCall(350, () => { 
                enemiesToDestroy.forEach(e => {
                    if (e.getData('ui')) e.getData('ui').forEach(ui => ui.destroy());
                    e.destroy();
                });
                
                if (isGameOverThisTurn) {
                    try { scene.sound.play('hit'); } catch(e) {}
                    takeDamage(1000, scene);
                }
                
                if(onComplete) onComplete(); 
            });
        }

        function handleDrag(pointer, gameObject, dragX, dragY) {
            if (isShooterMode) {
                if (gameObject.getData('isAllied')) {
                    // ★カメラが上に移動した分の座標(spaceYOffset)を足して移動範囲を補正
                    gameObject.x = Phaser.Math.Clamp(dragX, 50, 670);
                    gameObject.y = Phaser.Math.Clamp(dragY, 100 + spaceYOffset, 1180 + spaceYOffset);
                }
                return;
            }

            if (isTurnExecuting) return;
            gameObject.x = dragX;
            gameObject.y = dragY;
            gameObject.getData('text').x = dragX;
            gameObject.getData('text').y = dragY + 30; 
            gameObject.setDepth(10);
            gameObject.getData('text').setDepth(11);
        }

        function handleDragEnd(pointer, gameObject) {
            if (isShooterMode) return;

            gameObject.setDepth(0);
            gameObject.getData('text').setDepth(0);
            
            const scene = gameObject.scene;

            if (isTurnExecuting) { returnAllUnitToPosition(gameObject); return; }

            const dropGridX = Math.floor((gameObject.x - START_X) / TILE_SIZE);
            const dropGridY = Math.floor((gameObject.y - ALLIED_START_Y) / TILE_SIZE);
            const oldX = gameObject.getData('gridX');
            const oldY = gameObject.getData('gridY');

            if (dropGridX < 0 || dropGridX >= COLS || dropGridY < 0 || dropGridY >= ALLIED_ROWS || (dropGridX === oldX && dropGridY === oldY)) {
                returnAllUnitToPosition(gameObject); return;
            }

            let targetUnit = null;
            alliedUnits.getChildren().forEach(unit => {
                if (unit !== gameObject && unit.getData('gridX') === dropGridX && unit.getData('gridY') === dropGridY) {
                    targetUnit = unit;
                }
            });

            if (targetUnit && targetUnit.getData('type') === gameObject.getData('type') && targetUnit.getData('level') === gameObject.getData('level')) {
                const newLevel = gameObject.getData('level') + 1;
                const type = gameObject.getData('type');

                if (gameObject.getData('text')) gameObject.getData('text').destroy();
                if (targetUnit.getData('text')) targetUnit.getData('text').destroy();
                alliedUnits.remove(gameObject, true, true);
                alliedUnits.remove(targetUnit, true, true);

                spawnAlliedUnit(scene, newLevel, type, dropGridX, dropGridY, 10);
                executeTurn(scene);
            } else if (!targetUnit) {
                gameObject.setData('gridX', dropGridX);
                gameObject.setData('gridY', dropGridY);
                returnAllUnitToPosition(gameObject);
                executeTurn(scene);
            } else {
                returnAllUnitToPosition(gameObject);
            }
        }

        function returnAllUnitToPosition(unit) {
            const worldX = START_X + unit.getData('gridX') * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ALLIED_START_Y + unit.getData('gridY') * TILE_SIZE + TILE_SIZE / 2;
            unit.x = worldX;
            unit.y = worldY;
            unit.getData('text').x = worldX;
            unit.getData('text').y = worldY + 30; 
        }
    </script>
</body>
