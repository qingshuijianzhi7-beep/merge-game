<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge Shoot RPG - Turn Based</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #game-container { width: 100%; height: 100%; }
        canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        const config = {
            type: Phaser.AUTO,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 720,
                height: 1280,
                parent: 'game-container'
            },
            backgroundColor: '#1e1e1e',
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // --- 変数設定 ---
        let alliedUnits, enemyUnits;
        let turnText;
        let turn = 1;
        let isTurnExecuting = false; // ターン処理中（演出中）は操作できないようにするロック
        
        // ライフゲージ用
        const MAX_HP = 1000;
        let globalHP = 1000;
        let hpBarFill, hpText;

        // グリッド設定
        const COLS = 7;
        const ENEMY_ROWS = 7;
        const ALLIED_ROWS = 3;
        
        const TILE_SIZE = 90;
        const START_X = (720 - (TILE_SIZE * COLS)) / 2; // 45px
        
        // 全体を上にシフト
        const ENEMY_START_Y = 120;
        const ALLIED_START_Y = ENEMY_START_Y + (ENEMY_ROWS * TILE_SIZE) + 40; // 敵と味方の間の隙間(40px)

        function preload() {}

        function create() {
            // --- UIテキスト (上に配置) ---
            turnText = this.add.text(360, 40, `TURN: ${turn}`, { fontSize: '32px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

            // --- 敵エリア (7行x7列) ---
            setupGrid(this, { x: START_X, y: ENEMY_START_Y, color: 0x4a1a1a }, ENEMY_ROWS, COLS);

            // --- 味方エリア (3行x7列) ---
            setupGrid(this, { x: START_X, y: ALLIED_START_Y, color: 0x3a3a3a }, ALLIED_ROWS, COLS);

            alliedUnits = this.add.group();
            enemyUnits = this.add.group();

            // --- 初期配置テスト ---
            spawnAlliedUnit(this, 1, 'Warrior', 0, 0, 1);
            spawnAlliedUnit(this, 1, 'Warrior', 1, 0, 1);
            spawnAlliedUnit(this, 2, 'Mage',    3, 1, 2);
            spawnAlliedUnit(this, 3, 'Dragon',  6, 2, 4);

            spawnEnemyUnit(this, 5, 'Boss',  3, 0, 300);
            spawnEnemyUnit(this, 2, 'Slime', 1, 3, 50);
            spawnEnemyUnit(this, 2, 'Slime', 5, 4, 50);

            // ==========================================
            // 画面下のUI（ライフゲージ ＆ 丸形FIREボタン）
            // ==========================================
            const uiY = 1150; // 下部の空きスペース中央

            // ライフテキスト
            this.add.text(70, uiY, 'LIFE', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            // ライフバーの背景（グレー）
            this.add.rectangle(130, uiY, 380, 40, 0x555555).setOrigin(0, 0.5);
            // ライフバーの中身（緑色）
            hpBarFill = this.add.rectangle(130, uiY, 380, 40, 0x00e676).setOrigin(0, 0.5);
            // ライフの数値
            hpText = this.add.text(320, uiY, `${globalHP} / ${MAX_HP}`, { fontSize: '22px', fill: '#000', fontStyle:'bold' }).setOrigin(0.5);

            // FIREボタン（丸形、右側に配置）
            const attackBtn = this.add.circle(620, uiY, 60, 0xff3d00).setInteractive();
            this.add.text(620, uiY, 'FIRE!', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            
            // FIREボタンタップでターン実行
            attackBtn.on('pointerdown', () => {
                executeTurn(this);
            });

            this.input.on('drag', handleDrag, this);
            this.input.on('dragend', handleDragEnd, this);
        }

        function update() {}

        function setupGrid(scene, config, rows, cols) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const tileX = config.x + c * TILE_SIZE + TILE_SIZE / 2;
                    const tileY = config.y + r * TILE_SIZE + TILE_SIZE / 2;
                    scene.add.rectangle(tileX, tileY, TILE_SIZE - 4, TILE_SIZE - 4, config.color).setOrigin(0.5);
                }
            }
        }

        function spawnAlliedUnit(scene, level, type, gridX, gridY, hp) {
            const worldX = START_X + gridX * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ALLIED_START_Y + gridY * TILE_SIZE + TILE_SIZE / 2;
            const unit = scene.add.rectangle(worldX, worldY, TILE_SIZE - 10, TILE_SIZE - 10, getUnitColor(level)).setOrigin(0.5);
            unit.setInteractive();
            scene.input.setDraggable(unit);
            unit.setData({ isAllied: true, level: level, type: type, gridX: gridX, gridY: gridY, hp: hp });
            const text = scene.add.text(worldX, worldY, `Lv${level}\n${type}`, { fontSize: '18px', fill: '#000', align: 'center', fontStyle: 'bold' }).setOrigin(0.5);
            unit.setData('text', text);
            alliedUnits.add(unit);
            return unit;
        }

        function spawnEnemyUnit(scene, level, type, gridX, gridY, hp) {
            const worldX = START_X + gridX * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ENEMY_START_Y + gridY * TILE_SIZE + TILE_SIZE / 2;
            const unit = scene.add.rectangle(worldX, worldY, TILE_SIZE - 10, TILE_SIZE - 10, 0xcc0000).setOrigin(0.5);
            unit.setData({ isAllied: false, hp: hp, level: level, gridX: gridX, gridY: gridY });
            const text = scene.add.text(worldX, worldY, `Lv${level}\nHP:${hp}`, { fontSize: '18px', fill: '#fff', align: 'center', fontStyle: 'bold' }).setOrigin(0.5);
            unit.setData('text', text);
            enemyUnits.add(unit);
            return unit;
        }

        function getUnitColor(level) {
            const colors = { 1: 0x90caf9, 2: 0x64b5f6, 3: 0xffb74d, 4: 0xff8a65 };
            return colors[level] || 0xeeeeee;
        }

        // --- ダメージ処理 ---
        function takeDamage(amount) {
            globalHP -= amount;
            if (globalHP < 0) globalHP = 0;
            
            hpBarFill.width = 380 * (globalHP / MAX_HP);
            hpText.setText(`${globalHP} / ${MAX_HP}`);

            if (globalHP === 0) {
                alert("GAME OVER! 味方のライフがゼロになった！");
            }
        }

        // ==========================================
        // ターン制御（行動開始）
        // ==========================================
        function executeTurn(scene) {
            if (isTurnExecuting) return; // 処理中は重ねて押せないようにする
            isTurnExecuting = true;

            // 1. 味方の一斉攻撃
            handleAttack(scene, () => {
                // 2. 攻撃アニメーションが終わったら、敵が1マス前進
                moveEnemiesForward(scene, () => {
                    // 3. すべて完了したらターンを進める
                    turn++;
                    turnText.setText(`TURN: ${turn}`);
                    isTurnExecuting = false;
                });
            });
        }

        // --- 攻撃処理（完了時にコールバックを呼ぶ） ---
        function handleAttack(scene, onComplete) {
            const targets = enemyUnits.getChildren();
            const allies = alliedUnits.getChildren();
            
            if (targets.length === 0 || allies.length === 0) {
                if(onComplete) onComplete();
                return;
            }

            allies.forEach(unit => {
                const beam = scene.add.rectangle(unit.x, unit.y, 8, 150, 0xffea00).setOrigin(0.5);
                scene.physics.add.existing(beam);
                beam.body.setVelocityY(-1200);

                const targetEnemy = targets[Math.floor(Math.random() * targets.length)];
                const damage = unit.getData('level') * 20; 
                
                scene.time.delayedCall(200, () => {
                    if (targetEnemy.active) {
                        const currentHP = targetEnemy.getData('hp');
                        const newHP = currentHP - damage;
                        if (newHP <= 0) {
                            targetEnemy.getData('text').destroy();
                            targetEnemy.destroy();
                        } else {
                            targetEnemy.setData('hp', newHP);
                            targetEnemy.getData('text').setText(`Lv${targetEnemy.getData('level')}\nHP:${newHP}`);
                        }
                    }
                    beam.destroy();
                });
            });

            // ビーム発射演出が終わるまで待つ
            scene.time.delayedCall(400, () => {
                if(onComplete) onComplete();
            });
        }

        // --- 敵の前進処理 ---
        function moveEnemiesForward(scene, onComplete) {
            const enemies = enemyUnits.getChildren();
            let enemiesToDestroy = [];

            if(enemies.length === 0) {
                if(onComplete) onComplete();
                return;
            }

            enemies.forEach(enemy => {
                let newY = enemy.getData('gridY') + 1; // 1マス下へ
                enemy.setData('gridY', newY);
                const worldY = ENEMY_START_Y + newY * TILE_SIZE + TILE_SIZE / 2;

                // 敵が一番下（7行目）を超えて味方エリアに侵入した場合
                if (newY >= ENEMY_ROWS) {
                    takeDamage(enemy.getData('hp')); // 敵の残りHP分、味方ライフにダメージ！
                    enemiesToDestroy.push(enemy);
                } else {
                    // 通常の前進アニメーション
                    scene.tweens.add({
                        targets: [enemy, enemy.getData('text')],
                        y: worldY,
                        duration: 300
                    });
                }
            });

            // 侵入した敵は消滅させる
            enemiesToDestroy.forEach(e => {
                e.getData('text').destroy();
                e.destroy();
            });

            // アニメーションが終わるまで待つ
            scene.time.delayedCall(350, () => {
                if(onComplete) onComplete();
            });
        }

        // --- ドラッグ中の処理 ---
        function handleDrag(pointer, gameObject, dragX, dragY) {
            if (isTurnExecuting) return; // 攻撃中などは動かせない
            gameObject.x = dragX;
            gameObject.y = dragY;
            gameObject.getData('text').x = dragX;
            gameObject.getData('text').y = dragY;
            gameObject.setDepth(10);
            gameObject.getData('text').setDepth(11);
        }

        // --- ドロップ・合体判定 ---
        function handleDragEnd(pointer, gameObject) {
            gameObject.setDepth(0);
            gameObject.getData('text').setDepth(0);

            if (isTurnExecuting) {
                returnAllUnitToPosition(gameObject);
                return;
            }

            const dropGridX = Math.floor((gameObject.x - START_X) / TILE_SIZE);
            const dropGridY = Math.floor((gameObject.y - ALLIED_START_Y) / TILE_SIZE);
            const oldX = gameObject.getData('gridX');
            const oldY = gameObject.getData('gridY');

            // 枠外、または元の場所と同じマスで離した場合はターンを消費しない
            if (dropGridX < 0 || dropGridX >= COLS || dropGridY < 0 || dropGridY >= ALLIED_ROWS || (dropGridX === oldX && dropGridY === oldY)) {
                returnAllUnitToPosition(gameObject);
                return;
            }

            let targetUnit = null;
            alliedUnits.getChildren().forEach(unit => {
                if (unit !== gameObject && unit.getData('gridX') === dropGridX && unit.getData('gridY') === dropGridY) {
                    targetUnit = unit;
                }
            });

            if (targetUnit && targetUnit.getData('type') === gameObject.getData('type') && targetUnit.getData('level') === gameObject.getData('level')) {
                // 合体成功
                const newLevel = gameObject.getData('level') + 1;
                const type = gameObject.getData('type');

                alliedUnits.remove(gameObject);
                alliedUnits.remove(targetUnit);
                gameObject.getData('text').destroy();
                targetUnit.getData('text').destroy();
                gameObject.destroy();
                targetUnit.destroy();

                spawnAlliedUnit(gameObject.scene, newLevel, type, dropGridX, dropGridY, 10);
                
                // 行動完了！ターン消費
                executeTurn(gameObject.scene);

            } else if (!targetUnit) {
                // 空きマスへの移動成功
                gameObject.setData('gridX', dropGridX);
                gameObject.setData('gridY', dropGridY);
                returnAllUnitToPosition(gameObject);
                
                // 行動完了！ターン消費
                executeTurn(gameObject.scene);

            } else {
                // 移動先に違うキャラがいて合体できない場合は無効（ターン消費なし）
                returnAllUnitToPosition(gameObject);
            }
        }

        function returnAllUnitToPosition(unit) {
            const worldX = START_X + unit.getData('gridX') * TILE_SIZE + TILE_SIZE / 2;
            const worldY = ALLIED_START_Y + unit.getData('gridY') * TILE_SIZE + TILE_SIZE / 2;
            unit.x = worldX;
            unit.y = worldY;
            unit.getData('text').x = worldX;
            unit.getData('text').y = worldY;
        }
    </script>
</body>
</html>
